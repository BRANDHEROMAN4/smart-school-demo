<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDUVIA — الانتقال إلى المنصّة</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0;url=index.html">
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#16366B 0%,#1E8FD0 45%,#17A39B 72%,#34B45E 100%);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;text-align:center;padding:24px}
  .c{max-width:420px}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:14px;line-height:1.8;opacity:.92;margin:0 0 18px}
  a{display:inline-block;padding:13px 22px;border-radius:12px;background:#fff;color:#16366B;
    font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main class="c">
  <h1>هذه الصفحة نُقلت</h1>
  <p>
    تطبيق الأولياء المستقلّ أُوقف. الدخول الآن في منصّة EDUVIA نفسها،
    برقم الهاتف والرمز السرّي — بمصادقة حقيقية على الخادم.
  </p>
  <a id="go" href="index.html">الانتقال إلى المنصّة</a>
</main>
<script>
/* انتقالٌ يحافظ على ?id=… إن جاء من بوّابة الأولياء. */
(function(){
  var q=location.search||"";
  var u="index.html"+q;
  var a=document.getElementById("go");
  if(a) a.setAttribute("href",u);
  location.replace(u);
})();
</script>
</body>
</html>
