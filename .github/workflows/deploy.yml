name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # لا ننشر إلا ما يحتاجه الزائر. ملفّات القوائم والرموز (roster/students)
      # مستثناة من Git أصلًا؛ الاستثناء هنا طبقة أمان ثانية.
      - name: Stage public site only
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.netlify' \
            --exclude='sql' --exclude='tests' --exclude='tools' \
            --exclude='*.md' --exclude='serve.js' --exclude='netlify.toml' \
            --exclude='.gitignore' \
            --exclude='roster*.csv' --exclude='students*.csv' --exclude='data' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
